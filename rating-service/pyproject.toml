[project]
name = "rating-mcp"
version = "0.1.0"
description = "DB-free Turkish rating data cache with REST UI and HTTP MCP tools"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "dateparser>=1.2.0",
  "fastapi>=0.115.0",
  "fastmcp>=2.0.0",
  "feedparser>=6.0.11",
  "filelock>=3.15.4",
  "html5lib>=1.1",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "lxml>=5.2.2",
  "pandas>=2.2.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pypdf>=4.3.1",
  "python-dateutil>=2.9.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.2",
  "rapidfuzz>=3.9.6",
  "typer>=0.12.3",
  "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.5.6",
]

[project.scripts]
rating-mcp = "app.cli:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
