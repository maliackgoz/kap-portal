services:
  rating-mcp:
    image: memobaba44/rating-mcp:latest
    container_name: rating-mcp
    ports:
      - "${RATING_MCP_PORT:-8787}:8787"
    environment:
      RATING_MCP_DATA_DIR: /app/data
      RATING_MCP_API_KEY: ${RATING_MCP_API_KEY:-}
      RATING_MCP_USER_AGENT: ${RATING_MCP_USER_AGENT:-RatingMCP/0.1 (+financial analysis team)}
      RATING_MCP_TIMEOUT_SECONDS: ${RATING_MCP_TIMEOUT_SECONDS:-15}
      RATING_MCP_RATE_LIMIT_SECONDS: ${RATING_MCP_RATE_LIMIT_SECONDS:-1.0}
      RATING_MCP_MAX_PDF_DOWNLOADS_PER_PAGE: ${RATING_MCP_MAX_PDF_DOWNLOADS_PER_PAGE:-5}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
